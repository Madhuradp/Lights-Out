<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lights Out: F1 Fan Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&display=swap">
<style>:root { --red: #e10600; --ink: #f4f5f7; --mute: #9aa3ad; --panel: rgba(12, 14, 20, 0.82); --panel2: rgba(22, 25, 34, 0.9); --line: rgba(255,255,255,0.09); --purple: #b14cff; --green: #19d35a; --yellow: #ffd400; --font: 'Titillium Web', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #07080b; color: var(--ink); font-family: var(--font); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font-family: var(--font); cursor: pointer; }

/* ---------- menu ---------- */
#menu { position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y; background: radial-gradient(1200px 600px at 75% -10%, rgba(225,6,0,0.35), transparent 60%), radial-gradient(900px 500px at 0% 110%, rgba(16,185,168,0.18), transparent 60%), #07080b; z-index: 20; }
.menu-inner { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-size: clamp(34px, 6vw, 64px); margin: 0; font-weight: 900; letter-spacing: -1px; font-style: italic; }
.brand h1 span { color: var(--red); }
.brand .tag { color: var(--mute); font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
.lead { color: #c9ced6; max-width: 720px; margin: 8px 0 22px; font-size: 16px; line-height: 1.45; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode { position: relative; text-align: left; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)); border-radius: 14px; padding: 18px; color: var(--ink); min-height: 150px; overflow: hidden; transition: transform .12s, border-color .12s; }
.mode:hover, .mode.sel { border-color: var(--red); transform: translateY(-2px); }
.mode .k { font-size: 12px; letter-spacing: 2px; color: var(--red); font-weight: 700; text-transform: uppercase; }
.mode h3 { margin: 6px 0 6px; font-size: 24px; font-weight: 800; font-style: italic; }
.mode p { margin: 0; color: #b9c0c9; font-size: 14px; line-height: 1.4; }
.section { margin-top: 26px; }
.section h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--mute); }
.circuits { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.circuit { text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px; color: var(--ink); display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.circuit.sel { border-color: var(--red); background: rgba(225,6,0,0.08); }
.circuit svg { width: 96px; height: 70px; }
.circuit b { font-size: 17px; display: block; }
.circuit small { color: var(--mute); display: block; line-height: 1.3; margin-top: 3px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt label { font-size: 13px; color: var(--mute); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink); padding: 7px 11px; border-radius: 8px; font-size: 14px; }
.seg button.sel { background: var(--ink); color: #0b0c10; border-color: var(--ink); font-weight: 700; }
.opt input[type=range] { width: 100%; accent-color: var(--red); }
.opt input[type=text] { background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; border-radius: 8px; font-family: var(--font); font-size: 15px; }
.teams { display: flex; flex-wrap: wrap; gap: 6px; }
.teams button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; }
.teams button.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.5) inset; }
.go { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--red); color: #fff; border: 0; padding: 14px 26px; border-radius: 10px; font-size: 18px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-style: italic; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.help { color: var(--mute); font-size: 13px; line-height: 1.5; margin-top: 14px; }
.help kbd { background: rgba(255,255,255,.1); border-radius: 4px; padding: 1px 5px; font-family: var(--font); font-size: 12px; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: #07080b; z-index: 30; }
#loading .bar { width: 260px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 14px; }
#loading .bar i { display: block; height: 100%; width: 30%; background: var(--red); animation: load 1s infinite ease-in-out; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

/* ---------- hud ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#hud .pe { pointer-events: auto; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#gforce { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%); opacity: 0; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#visor { position: absolute; inset: 0; width: 100%; height: 100%; }
#tunnelDark { position: absolute; inset: 0; background: #000; opacity: 0; }

.tower { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 10px; width: 210px; background: var(--panel); border-radius: 8px; overflow: hidden; font-size: 13px; backdrop-filter: blur(6px); }
.tower .hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 9px; background: rgba(225,6,0,0.92); font-weight: 800; letter-spacing: 1px; font-style: italic; }
.tower .hd span { font-size: 12px; opacity: .9; }
.row { display: grid; grid-template-columns: 24px 4px 40px 1fr 18px; gap: 6px; align-items: center; padding: 2px 8px; height: 21px; border-top: 1px solid rgba(255,255,255,0.04); }
.row .p { font-weight: 800; text-align: right; }
.row .tc { width: 4px; height: 14px; border-radius: 2px; }
.row .c { font-weight: 700; letter-spacing: .5px; }
.row .g { text-align: right; color: #cfd5dd; font-variant-numeric: tabular-nums; font-size: 12px; }
.row .t { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid; font-size: 9px; font-weight: 800; display: grid; place-items: center; background: #111; }
.row.me { background: rgba(255,255,255,0.14); }
.row.mate { background: rgba(255,255,255,0.06); }
.row .pit { color: #0b0c10; background: #fff; font-size: 9px; font-weight: 800; border-radius: 3px; padding: 0 3px; }
.row.out { opacity: .45; }

.topc { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: stretch; }
.chip { background: var(--panel); border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(6px); }
.chip small { color: var(--mute); font-weight: 600; font-size: 11px; letter-spacing: 1px; }
.chip.flag-sc, .chip.flag-vsc { background: #ffcf00; color: #111; }
.chip.flag-yellow { background: #ffcf00; color: #111; }
.chip.flag-green { background: #10a84a; }
.posbig { font-size: 26px; font-style: italic; line-height: 1; }

.lapinfo { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 10px; background: var(--panel); border-radius: 8px; padding: 8px 10px; width: 210px; font-size: 13px; backdrop-filter: blur(6px); }
.lapinfo .ln { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.lapinfo .ln b { font-size: 16px; }
.sectors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 6px 0; }
.sectors div { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); }
.sectors .purple { background: var(--purple); } .sectors .green { background: var(--green); } .sectors .yellow { background: var(--yellow); }
.delta { font-weight: 800; font-size: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.delta.neg { color: var(--green); } .delta.pos { color: #ff4d4d; }

.banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; animation: bannerIn .35s ease-out; }
.banner .t { font-size: clamp(30px, 6vw, 64px); font-weight: 900; font-style: italic; letter-spacing: 1px; padding: 4px 26px; background: var(--panel); border-left: 8px solid var(--red); }
.banner .s { margin-top: 6px; font-size: 18px; color: #dfe3e8; font-weight: 700; }
.banner.purple .t { border-color: var(--purple); } .banner.sc .t { background: #ffcf00; color: #111; border-color: #111; } .banner.green .t { border-color: var(--green); } .banner.flag .t { background: repeating-conic-gradient(#111 0 25%, #f5f5f5 0 50%) 0 0/24px 24px; color: #fff; text-shadow: 0 2px 6px #000; }
@keyframes bannerIn { from { opacity: 0; transform: translate(-50%, -12px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

.rc { position: absolute; top: calc(56px + var(--mirrorH, 0px)); left: 50%; transform: translateX(-50%); max-width: 520px; width: max-content; }
.rc div { background: rgba(10,10,14,0.85); border-left: 4px solid #fff; padding: 5px 10px; margin-top: 4px; font-size: 13px; font-weight: 700; animation: bannerIn .3s; }
.rc .sc, .rc .yellow, .rc .warn { border-color: #ffcf00; } .rc .pen { border-color: var(--red); } .rc .purple { border-color: var(--purple); } .rc .green { border-color: var(--green); }

.radio { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: 35%; max-width: 330px; background: var(--panel2); border-radius: 10px; padding: 8px 12px; font-size: 14px; border-left: 4px solid var(--red); animation: bannerIn .25s; }
.radio .who { font-size: 11px; letter-spacing: 2px; color: var(--mute); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.radio .who i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 0.6s infinite alternate; }
@keyframes pulse { to { opacity: .2; } }

.battle { position: absolute; top: calc(124px + var(--mirrorH, 0px)); left: 50%; transform: translateX(-50%); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 13px; display: flex; gap: 12px; align-items: center; font-weight: 700; }
.battle .vs { color: var(--mute); }
.battle .gap { font-size: 18px; color: var(--yellow); font-variant-numeric: tabular-nums; }
.battle .ot { background: #12c2ff; color: #011; padding: 1px 6px; border-radius: 4px; font-size: 11px; }

/* steering wheel */
.wheel { position: absolute; left: 50%; bottom: -46px; width: 440px; height: 210px; margin-left: -220px; transform-origin: 50% 85%; pointer-events: none; }
.wheel .body { position: absolute; inset: 0; background: linear-gradient(#22252c, #0d0e12); border-radius: 60px 60px 30px 30px; box-shadow: 0 -4px 20px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.08); }
.wheel .grip { position: absolute; top: 30px; width: 70px; height: 170px; background: #121318; border-radius: 30px; }
.wheel .grip.l { left: -26px; } .wheel .grip.r { right: -26px; }
.wheel .screen { position: absolute; left: 92px; right: 92px; top: 34px; height: 104px; background: #000; border-radius: 6px; border: 2px solid #2a2d33; display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: center; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.wheel .gear { font-size: 64px; font-weight: 900; text-align: center; line-height: 1; }
.wheel .spd { font-size: 24px; font-weight: 800; } .wheel .spd small, .wheel .dl small { display: block; font-size: 10px; color: var(--mute); letter-spacing: 1px; }
.wheel .dl { text-align: right; font-size: 18px; font-weight: 800; }
.wheel .leds { position: absolute; left: 96px; right: 96px; top: 14px; display: flex; justify-content: space-between; }
.wheel .leds i { width: 12px; height: 12px; border-radius: 50%; background: #1a1c20; }
.wheel .leds i.g { background: #19d35a; box-shadow: 0 0 8px #19d35a; } .wheel .leds i.r { background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a; } .wheel .leds i.b { background: #3aa0ff; box-shadow: 0 0 8px #3aa0ff; }
.wheel .modes { position: absolute; left: 96px; right: 96px; top: 142px; display: flex; gap: 4px; justify-content: center; }
.wheel .modes span { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 3px; background: #1a1c20; color: #555; letter-spacing: .5px; }
.wheel .modes span.on { color: #000; }
.wheel .modes .aero.on { background: #3aa0ff; } .wheel .modes .ot.on { background: #12e0ff; } .wheel .modes .ot.avail { color: #12e0ff; border: 1px solid #12e0ff; } .wheel .modes .boost.on { background: #ff8a00; } .wheel .modes .rech.on { background: #19d35a; } .wheel .modes .lim.on { background: #ffcf00; }
.wheel .batt { position: absolute; left: 30px; top: 40px; width: 14px; height: 100px; background: #1a1c20; border-radius: 4px; overflow: hidden; }
.wheel .batt i { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(#12e0ff, #0a7fff); }
.wheel .tyrew { position: absolute; right: 26px; top: 40px; width: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.wheel .tyrew i { height: 46px; border-radius: 4px; background: #19d35a; }
.wheel .btns { position: absolute; left: 50px; right: 50px; top: 180px; }

.minimap { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 10px; width: 170px; height: 150px; background: var(--panel); border-radius: 8px; }
.lights { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: #0b0b0d; padding: 12px; border-radius: 10px; }
.lights .col { display: flex; flex-direction: column; gap: 8px; }
.lights i { width: 36px; height: 36px; border-radius: 50%; background: #2a0000; }
.lights i.on { background: #ff1414; box-shadow: 0 0 22px #ff1414; }

.tyrebox { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 140px; width: 210px; background: var(--panel); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
.tyrebox .tl { display: flex; align-items: center; gap: 8px; }
.tyrebox .bars { height: 5px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.tyrebox .bars i { display: block; height: 100%; background: var(--green); }
.tbadge { width: 22px; height: 22px; border-radius: 50%; border: 3px solid; display: grid; place-items: center; font-weight: 900; font-size: 11px; background: #111; flex: none; }

/* buttons */
.hbtn { pointer-events: auto; border: 1px solid rgba(255,255,255,0.18); background: rgba(12,14,20,0.72); color: #fff; border-radius: 10px; font-weight: 800; font-size: 13px; padding: 8px 12px; letter-spacing: .5px; backdrop-filter: blur(6px); }
.hbtn.on { background: #fff; color: #000; }
.hbtn.ot { border-color: #12e0ff; color: #12e0ff; } .hbtn.ot.on { background: #12e0ff; color: #011; }
.hbtn.boost.on { background: #ff8a00; color: #000; }
.hbtn.rech.on { background: #19d35a; color: #000; }
.hbtn.box.on { background: var(--red); color: #fff; border-color: var(--red); }
.hbtn:disabled { opacity: .35; }
.topbtns { position: absolute; right: max(230px, calc(env(safe-area-inset-right) + 230px)); top: 10px; display: flex; gap: 6px; }

/* touch controls */
#touch { position: absolute; inset: 0; pointer-events: none; }
#touch .pad { pointer-events: auto; position: absolute; }
.steerpad { left: max(12px, env(safe-area-inset-left)); bottom: 16px; width: 38vw; max-width: 320px; height: 120px; border-radius: 60px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); }
.steerpad .knob { position: absolute; top: 50%; left: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.5); }
.steerpad .lbl, .pedal .lbl { position: absolute; bottom: -18px; width: 100%; text-align: center; font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 2px; }
.pedal { bottom: 16px; width: 92px; height: 150px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); display: grid; place-items: center; font-weight: 900; font-size: 13px; letter-spacing: 1px; }
.pedal.thr { right: max(12px, env(safe-area-inset-right)); background: rgba(25,211,90,0.18); border-color: rgba(25,211,90,0.5); }
.pedal.brk { right: calc(max(12px, env(safe-area-inset-right)) + 104px); background: rgba(225,6,0,0.18); border-color: rgba(225,6,0,0.5); height: 120px; }
.pedal.down { filter: brightness(1.8); transform: scale(0.97); }
.tbtns { right: max(12px, env(safe-area-inset-right)); bottom: 180px; display: flex; gap: 6px; }
.tbtns .hbtn { padding: 10px 12px; font-size: 13px; }

/* pit menu & pit game */
.pitmenu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: min(460px, 94vw); pointer-events: auto; }
.pitmenu h3 { margin: 0 0 4px; font-style: italic; }
.pitmenu p { margin: 0 0 12px; color: var(--mute); font-size: 13px; }
.cmpds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cmpd { border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: #fff; border-radius: 10px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; position: relative; }
.cmpd .tbadge { width: 34px; height: 34px; font-size: 14px; border-width: 4px; }
.cmpd .rec { position: absolute; top: -8px; background: var(--green); color: #000; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
.cmpd.sel { border-color: #fff; background: rgba(255,255,255,0.12); }
.pitgame { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.45); pointer-events: auto; }
.pitgame .card { background: var(--panel2); border-radius: 16px; padding: 18px 22px; width: min(520px, 94vw); text-align: center; border: 1px solid var(--line); }
.pitgame h3 { margin: 0; font-style: italic; font-size: 22px; }
.pitgame .sub { color: var(--mute); font-size: 13px; margin: 4px 0 14px; }
.pg-wheels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.pg-wheels div { border-radius: 8px; padding: 8px 0; background: rgba(255,255,255,0.06); font-weight: 800; font-size: 13px; }
.pg-wheels div.done { background: var(--green); color: #000; } .pg-wheels div.cur { outline: 2px solid #fff; } .pg-wheels div.bad { background: #ff8a00; color: #000; }
.pg-track { position: relative; height: 30px; border-radius: 15px; background: rgba(255,255,255,0.08); overflow: hidden; }
.pg-zone { position: absolute; top: 0; bottom: 0; background: rgba(25,211,90,0.55); }
.pg-zone.perfect { background: rgba(25,211,90,0.95); }
.pg-mark { position: absolute; top: -2px; bottom: -2px; width: 5px; background: #fff; border-radius: 3px; box-shadow: 0 0 10px #fff; }
.pg-timer { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 10px; }
.pg-light { width: 60px; height: 60px; border-radius: 50%; margin: 10px auto 0; background: #400; }
.pg-light.green { background: #19d35a; box-shadow: 0 0 30px #19d35a; }
.pg-msg { font-weight: 800; min-height: 22px; }

/* pause / results */
.overlay { position: absolute; inset: 0; background: rgba(5,6,9,0.78); display: grid; place-items: center; pointer-events: auto; z-index: 15; overflow-y: auto; touch-action: pan-y; padding: 16px; }
.overlay .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(760px, 96vw); }
.overlay h2 { margin: 0 0 12px; font-style: italic; font-size: 30px; }
.res { width: 100%; border-collapse: collapse; font-size: 14px; }
.res td, .res th { padding: 5px 6px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
.res th { color: var(--mute); font-weight: 600; font-size: 12px; }
.res tr.me td { background: rgba(255,255,255,0.12); font-weight: 800; }
.res .tc { display: inline-block; width: 4px; height: 14px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 12px; }
.stat small { display: block; color: var(--mute); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.stat b { font-size: 20px; }

/* pit wall */
.pw-panel { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 10px; bottom: 10px; width: 330px; background: var(--panel); border-radius: 12px; pointer-events: auto; overflow-y: auto; touch-action: pan-y; padding: 12px; backdrop-filter: blur(8px); }
.pw-panel h5 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 2px; color: var(--mute); text-transform: uppercase; }
.pw-panel h5:first-child { margin-top: 0; }
.drvcard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.drvcard div { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 6px 8px; }
.drvcard small { display: block; color: var(--mute); font-size: 10px; letter-spacing: 1px; }
.drvcard b { font-size: 17px; font-variant-numeric: tabular-nums; }
.pw-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.pw-seg.three { grid-template-columns: repeat(3, 1fr); }
.pw-seg button { border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: #fff; padding: 8px 2px; border-radius: 8px; font-size: 12px; font-weight: 700; }
.pw-seg button.sel { background: #fff; color: #000; }
.pw-box { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 6px; }
.pw-box button { border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: #fff; border-radius: 8px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; }
.pw-box button.sel { border-color: var(--red); background: rgba(225,6,0,0.2); }
.boxbtn { width: 100%; margin-top: 8px; padding: 11px; border-radius: 10px; border: 0; font-weight: 900; font-size: 15px; letter-spacing: 1px; background: var(--red); color: #fff; font-style: italic; }
.boxbtn.armed { background: #fff; color: var(--red); animation: pulse .5s infinite alternate; }
.radar { height: 70px; border-radius: 8px; background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.04)); position: relative; overflow: hidden; }
.radar canvas { width: 100%; height: 100%; }
.radiolog { font-size: 12px; max-height: 140px; overflow-y: auto; }
.radiolog div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.radiolog b { color: var(--red); font-size: 10px; letter-spacing: 1px; margin-right: 4px; }
.pw-cams { position: absolute; left: 50%; bottom: 12px; transform: translateX(calc(-50% - 170px)); display: flex; gap: 6px; pointer-events: auto; }
.pw-map { width: 100%; height: 150px; border-radius: 8px; background: rgba(0,0,0,0.25); }
.pw-toggle { display: none; }

.hint { position: absolute; left: 10px; bottom: 14px; background: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 12px; color: #cfd5dd; }
.rotate { position: absolute; inset: 0; display: none; place-items: center; background: #07080b; z-index: 40; text-align: center; padding: 30px; }

@media (max-width: 900px), (max-height: 520px) {
  .tower { width: 168px; font-size: 11px; top: 6px; left: 6px; }
  .row { height: 17px; grid-template-columns: 20px 3px 34px 1fr 15px; gap: 4px; padding: 1px 6px; }
  .row .t { width: 14px; height: 14px; font-size: 8px; border-width: 2px; }
  .lapinfo { width: 168px; top: 6px; right: 6px; padding: 6px 8px; font-size: 11px; }
  .lapinfo .ln b { font-size: 13px; }
  .tyrebox { display: none; }
  .wheel { transform: scale(0.62); bottom: -58px; }
  .minimap { display: none; }
  .topbtns { right: 180px; top: 6px; }
  .chip { padding: 4px 9px; font-size: 13px; }
  .posbig { font-size: 20px; }
  .banner .t { font-size: 30px; }
  .radio { bottom: auto; top: 44%; font-size: 12px; max-width: 260px; }
  .pw-panel { width: 280px; top: 6px; bottom: 6px; right: 6px; padding: 10px; }
  .pw-panel.collapsed { width: auto; bottom: auto; }
  .pw-panel.collapsed > *:not(.pw-toggle) { display: none; }
  .pw-toggle { display: block; width: 100%; }
  .pw-cams { left: 6px; transform: none; bottom: 6px; }
  .battle { top: calc(76px + var(--mirrorH, 0px)); font-size: 11px; }
  .rc { top: 40px; max-width: 70vw; }
}
@media (orientation: portrait) and (max-width: 700px) { .rotate.need { display: grid; } }

.mirror { position: absolute; border: 3px solid #15171c; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); pointer-events: none; }
.rc .blue { border-color: #2b8cff; }

/* ---------- menu v2 ---------- */
.topline { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin: 14px 0 6px; }
.tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px; }
.tabs button { border: 0; background: transparent; color: #cfd5dd; padding: 9px 18px; border-radius: 9px; font-size: 15px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; font-style: italic; }
.tabs button.sel { background: var(--red); color: #fff; }
.lvl { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 250px; }
.lvl small { color: var(--mute); font-size: 11px; }
.xpbar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.xpbar.sm { height: 4px; margin: 4px 0 2px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), #ff8a00); }
.btn.sm { padding: 9px 18px; font-size: 14px; }
.btn:disabled, .seg button:disabled { opacity: .35; cursor: not-allowed; }
.scen { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.scard { border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.scard h3 { margin: 2px 0 0; font-style: italic; font-size: 21px; }
.scard small { color: var(--mute); }
.scard p { margin: 4px 0; color: #c9ced6; font-size: 14px; line-height: 1.4; flex: 1; }
.scard ul { margin: 0 0 8px; padding-left: 18px; color: #aeb6c0; font-size: 13px; }
.stop { display: flex; justify-content: space-between; }
.stag { font-size: 11px; letter-spacing: 2px; color: var(--red); font-weight: 800; text-transform: uppercase; }
.smedal { font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 10px; color: #111; }
.smedal.gold, .medal.gold .disc { background: linear-gradient(135deg, #ffe680, #d4a017); }
.smedal.silver, .medal.silver .disc { background: linear-gradient(135deg, #f2f4f7, #9aa3ad); }
.smedal.bronze, .medal.bronze .disc { background: linear-gradient(135deg, #f0b27a, #a0522d); }
.medal { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.medal .disc { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 900; color: #111; background: #333; flex: none; }
.medal.none .disc { color: #888; }
.medal b { font-size: 18px; font-style: italic; }
.champ { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: rgba(255,255,255,0.03); }
.champ-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
.cal { display: grid; gap: 6px; }
.round { display: grid; grid-template-columns: 36px 1fr auto auto; gap: 10px; align-items: center; background: rgba(255,255,255,0.04); border-radius: 9px; padding: 8px 10px; font-size: 14px; }
.round span { color: var(--mute); font-weight: 800; } .round small { color: var(--mute); } .round em { font-style: normal; font-weight: 800; color: #cfd5dd; }
.round.next { outline: 2px solid var(--red); } .round.done { opacity: .75; }
.champ-last { margin-bottom: 12px; }
.driver-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.helm { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
.helm canvas { width: 100%; max-width: 360px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.08), transparent 70%); border-radius: 14px; }
.helm-ctl { display: grid; gap: 12px; }
.helm input[type=color] { width: 54px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; }
.pats button { font-size: 12px; }
.hist div { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; } .hist small { color: var(--mute); }
.xpbox { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
.xprow { display: flex; justify-content: space-between; align-items: baseline; } .xprow b { font-size: 22px; color: #ffb000; font-style: italic; }
.xpl { display: flex; justify-content: space-between; font-size: 13px; color: #cfd5dd; padding: 2px 0; }
.lvlup { margin-top: 6px; font-weight: 900; color: #19d35a; font-style: italic; }
/* ---------- grandstand ---------- */
.gs-bar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
.gs-seat { position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%); background: var(--panel); padding: 4px 12px; border-radius: 8px; font-size: 12px; letter-spacing: 1px; color: #cfd5dd; }
.gs-comm { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: 64px; max-width: 420px; background: var(--panel2); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 700; border-left: 4px solid var(--red); }
.gs-comm div { padding: 2px 0; }
.gs-live { display: inline-block; background: var(--red); color: #fff; font-size: 10px; letter-spacing: 2px; padding: 1px 6px; border-radius: 3px; animation: pulse .8s infinite alternate; }
.gs-pred { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 10px; background: var(--panel); border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.gs-pred:empty { display: none; }
.gs-pred b { font-size: 11px; letter-spacing: 2px; color: var(--mute); }
.ph { margin: 12px 0 6px; font-size: 12px; letter-spacing: 2px; color: var(--mute); text-transform: uppercase; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: #fff; border-radius: 8px; padding: 6px 9px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.pchip small { color: var(--mute); font-weight: 600; font-size: 10px; }
.pchip .tc { width: 4px; height: 14px; border-radius: 2px; display: inline-block; }
.pchip.sel { background: #fff; color: #000; }
@media (max-width: 900px) {
  .champ-grid, .driver-grid, .helm { grid-template-columns: 1fr; }
  .gs-comm { bottom: 96px; font-size: 12px; max-width: 70vw; }
  .gs-pred { top: auto; bottom: 96px; right: 6px; }
  .lvl { min-width: 0; }
}
